# Render Static Site Blueprint for React Frontend
version: "1"

services:
  - type: web
    name: contactpay-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA Client-Side Routing Rewrite Rule (prevents 404 on page refresh)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
