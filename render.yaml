# Render Blueprint Specification
# Deploys Flask backend as a Python Web Service and React frontend as a Static Site
version: "1"

services:
  # -------------------------------------------------------------
  # Backend Web Service (Flask + Gunicorn)
  # -------------------------------------------------------------
  - type: web
    name: contactpay-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: AUTO_INIT_DB
        value: "true"
      # Database Configuration (supplied securely in Render Dashboard)
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "3306"
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Safaricom Daraja M-Pesa Configuration
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_BUSINESS_SHORT_CODE
        value: "174379"
      - key: MPESA_ACCOUNT_REFERENCE
        value: "Cliff's Sharp Boy Association"
      - key: MPESA_CALLBACK_URL
        sync: false
      # Allowed Frontend Origin for CORS
      - key: FRONTEND_URL
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: contactpay-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA Client-Side Routing Rewrite Rule (prevents 404 on page refresh)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Centralized Backend API URL
      - key: VITE_API_BASE_URL
        sync: false
